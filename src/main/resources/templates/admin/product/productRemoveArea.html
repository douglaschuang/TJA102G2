<!doctype html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/layout :: head(~{::extraHead})}"></head>

<body class="sidebar-expand-lg sidebar-open bg-body-tertiary">
	<!-- 子頁額外樣式：只放 DataTables 的 Bootstrap5 佈景（放在 body 裡，讓 head 的片段替換更穩定） -->
	<th:block th:fragment="extraHead">
		<link rel="stylesheet"
			href="https://cdn.datatables.net/2.0.7/css/dataTables.bootstrap5.min.css">
	</th:block>

	<!-- 用版型把下面兩個片段插入（容器會被整個替換，不會重複渲染） -->
	<div th:replace="~{admin/layout :: layout(~{::content}, ~{::extraJs})}">
		<!-- 內容區（fragment） -->
		<section th:fragment="content">
			<div class="app-content">
				<div class="container-fluid">
					<!-- 卡片：顯示「下架區」商品清單（status=0） -->
					<div class="card mb-4">
						<div class="card-header border-0">
							<h3 class="mb-0">商品清單</h3>
						</div>
						
						<!-- 右上功能按鈕 -->
						<div class="ms-auto">
							<a class="btn btn-success btn-sm"
								th:href="@{/admin/category/addCategory}"><i></i> 新增商品類別</a> <a
								class="btn btn-success btn-sm" th:href="@{addProduct}"><i></i>
								新增商品</a> <a class="btn btn-success btn-sm"
								th:href="@{listAllProduct}"><i></i> 上架區</a>
						</div>
						<div class="card-body table-responsive p-0">
							<!-- 下架區的表格：注意本頁 table id 是 productRemoveAreaTable -->
							<table id="productRemoveAreaTable"
								class="table table-striped table-bordered align-middle w-100">
								<thead>
									<tr>
										<th>商品ID</th> <!-- 這欄實際顯示的是迴圈序號（productVOStat.count） -->
										<th>商品編號</th>
										<th>商品<br>名稱
										</th>
										<th>商品<br>類別ID
										</th>
										<th>價格</th>
										<th>狀態</th>
										<th>狀態異<br>動時間
										</th>
										<th>圖示</th>
										<th>更新<br>時間
										</th>
										<th>檢視</th>
										<th>修改</th>
									</tr>
								</thead>
								<tbody>
									<!-- 逐筆渲染商品：productListData 由後端塞入（這裡是 status=0 的清單） -->
									<th:block th:each="productVO : ${productListData}">
										<tr>
											<!-- 迴圈序號（非資料庫主鍵） -->
											<td th:text="${productVOStat.count}"></td>
											<td th:text="${productVO.productNo}"></td>
											<td th:text="${productVO.productName}"></td>
											<!-- 類別顯示：ID 與名稱 -->
											<td
												th:text="${productVO.categoryVO.categoryId} + '-[' + ${productVO.categoryVO.categoryName} + ']'">
											</td>
											<td th:text="${productVO.price}"></td>
											<!-- 使用 VO 的衍生屬性（@Transient）顯示狀態/時間 -->
											<td th:text="${productVO.statusStr}"></td>
											<td th:text="${productVO.statusUpdateTimeStr}"></td>
											<!-- 圖片：由 /product/DBGifReader 依 productId 回傳 BLOB 圖檔 -->
											<td>
												<img
												th:src="@{/product/DBGifReader} + '?productId=' + ${productVO.productId}"
												width="100px">
											</td>
											<td th:text="${productVO.updateTimeStr}"></td>
											
											<!-- 檢視：POST 送到 getOne_For_Detail，後端查單筆並導向檢視頁 -->
											<td>
												<form method="post" th:action="@{getOne_For_Detail}"
													style="margin-bottom: 0px;">
													<input type="submit"
														class="btn btn btn-outline-dark btn-sm" value="檢視">
													<input type="hidden" name="product_id"
														th:value="${productVO.productId}">
												</form>
											</td>
											
											<!-- 修改：POST 送到 getOne_For_Update，後端查單筆並導向修改頁 -->
											<td>
												<form method="post" th:action="@{getOne_For_Update}"
													style="margin-bottom: 0px;">
													<input type="submit" class="btn btn-danger btn-sm"
														value="修改"> <input type="hidden" name="product_id"
														th:value="${productVO.productId}">
												</form>
											</td>
										</tr>
									</th:block>
								</tbody>
							</table>
						</div>
					</div>
				</div>
			</div>
		</section>

		<!-- 本頁 JS（fragment） -->
		<th:block th:fragment="extraJs">
			<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
			<script src="https://cdn.datatables.net/2.0.7/js/dataTables.min.js"></script>
			<script
				src="https://cdn.datatables.net/2.0.7/js/dataTables.bootstrap5.min.js"></script>
			<script>
				document.addEventListener('DOMContentLoaded',function() {
					const sel = '#productTable';
					if ($.fn.DataTable.isDataTable(sel))
						return; // 防止重複初始化
					$(sel).DataTable({
						retrieve : true,
							lengthMenu : [ 3, 5,10, 20, 50, 100 ],
							language : {
								processing : "處理中...",
								loadingRecords : "載入中...",
								lengthMenu : "顯示 _MENU_ 筆結果",
								zeroRecords : "沒有符合的結果",
								info : "顯示第 _START_ 至 _END_ 筆結果，共 <span class='text-danger'>_TOTAL_</span> 筆",
								infoEmpty : "顯示第 0 至 0 筆結果，共 0 筆",
								infoFiltered : "(從 _MAX_ 筆結果中過濾)",
								search : "搜尋：",
								paginate : {
									first : "第一頁",
									previous : "上一頁",
									next : "下一頁",
									last : "最後一頁"
								},
								aria : {
									sortAscending : ": 升冪排列",
									sortDescending : ": 降冪排列"
								}
							}
						});
				});
			</script>
		</th:block>
	</div>
</body>
</html>
