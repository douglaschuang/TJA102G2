<!doctype html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<!-- 讓 layout 的 <head> 接手，並把本頁的 extraHead 傳進去 -->
<head th:replace="~{admin/layout :: head(~{::extraHead})}"></head>

<body class="sidebar-expand-lg bg-body-tertiary">
	<!-- 本頁額外 CSS（可留空） -->
	<th:block th:fragment="extraHead"></th:block>

	<!-- 用一個容器交給 layout；重點：用「命名參數」傳 content / extraJs -->
	<div
		th:replace="~{admin/layout :: layout(content=~{::content}, extraJs=~{::extraJs})}">

		<!-- 主要內容（只給 layout 插入，不會在這裡再渲染一次） -->
		<section th:fragment="content">
			<main class="app-main">
				<div class="app-content">
					<div class="container-fluid">
						<!-- 修改「商品類別」表單 -->
						<div class="card mb-4">
							<h3>修改商品類別：</h3>
							<!-- th:object 綁定 CategoryVO；送到 /admin/category/update（POST） -->
							<form th:action="@{update}" method="post"
								th:object="${categoryVO}" enctype="multipart/form-data">
								<!-- 關鍵：必須帶主鍵 categoryId，save() 才會執行更新而非新增 -->
								<input type="hidden" th:field="*{categoryId}" />

								<!-- 類別名稱（與新增頁相同欄位；會回填原值） -->
								<div>
									<label class="col-sm-2 col-form-label">類別名稱：</label> 
									<input
										type="text" th:field="*{categoryName}"
										onclick="hideContent('category_name.errors');" />
									<!-- 顯示欄位驗證錯誤 --> 
									<span
										th:if="${#fields.hasErrors('categoryName')}"
										th:errors="*{categoryName}" class="error"
										id="categoryName.errors">
									</span>
								</div>
								
								<!-- 送出修改 / 返回 -->
								<div>
									<button class="btn btn-primary" type="submit" id="submit"
											style="height: 40px; width: 100px">
											送出修改
									</button>
									<!-- 返回類別清單頁 -->
									<a class="btn btn-sm btn-primary" th:href="@{listAllCategory}"
									   style="height: 40px; line-height: 30px; width: 100px"><i></i>
									   返回
									</a>
								</div>
							</form>
						</div>
					</div>
				</div>
		</section>

		<!-- 本頁額外 JS（可留空） -->
		<th:block th:fragment="extraJs"></th:block>
	</div>
</body>
</html>
