<!DOCTYPE html>
<html class="no-js" lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">

<head
	th:replace="~{frontend/layout :: head('BabyMate', ~{::extraHead})}">
<th:block th:fragment="extraHead"></th:block>
</head>

<body
	th:replace="~{frontend/layout :: layout('about', ~{::content}, ~{::extraJs}, 'footer-one')}">
	<section th:fragment="content">
		<div th:replace="~{frontend/fragments/breadcrumb :: breadcrumb('商城')}"></div>

		<!-- Shop 包裹（上方排序 + 側邊欄 + 內容） -->
		<div class="shop-page-wrapper">
		
			<!-- 頁首：排序（最新/價格由低到高/由高到低） -->
			<div class="shop-page-header">
				<div class="container">
					<div class="row align-items-center">
					
						<!-- 左：排序連結（依 sort 參數高亮） -->
						<div class="col-12 col-lg-7 col-md-10 d-none d-md-block">
							<div class="filter-title filter-title--type-two">
								<ul class="product-filter-menu">
									<li th:classappend="${sort} == 'newProduct' ? '' ">
										<a th:href="@{/shop/left(sort='newProduct')}">最新</a>
									</li>
									<li th:classappend="${sort} == 'priceAsc' ? '' ">
										<a th:href="@{/shop/left(sort='priceAsc')}">價格: 由低到高</a>
									</li>
									<li th:classappend="${sort} == 'priceDesc' ? '' ">
										<a th:href="@{/shop/left(sort='priceDesc')}">價格: 由高到低</a>
									</li>
								</ul>
							</div>
						</div>
						
						<!-- 右：版型切換（grid/list） -->
						<div class="col-12 col-lg-5 col-md-2">
							<div class="filter-icons">
								<div class="single-icon grid-icons" aria-label="版型切換">
									<a data-target="five-column" href="javascript:void(0)">
										<i class="ti-layout-grid4-alt" aria-hidden="true"></i>
									</a> 
									<a data-target="four-column" class="active" href="javascript:void(0)">
										<i class="ti-layout-grid3-alt" aria-hidden="true"></i>
									</a> 
									<a data-target="three-column" href="javascript:void(0)">
										<i class="ti-layout-grid2-alt" aria-hidden="true"></i>
									</a> 
									<a data-target="list" href="javascript:void(0)">
										<i class="ti-view-list" aria-hidden="true"></i>
									</a>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>

			<!-- 主要內容：側邊欄 + 商品清單 -->
			<div class="shop-page-content mt-100 mb-100">
				<div class="container">
					<div class="row">
						
						<!-- 側邊欄（分類 + 價格範圍） -->
						<div class="col-lg-3 order-2 order-lg-1">
							<div class="page-sidebar">
							
								<!-- 全站商品分類（顯示每類別數量） -->
								<div class="single-sidebar-widget mb-40">
									<h2 class="single-sidebar-widget--title">全站商品分類</h2>
									<ul class="single-sidebar-widget--list single-sidebar-widget--list--category">
										<!-- 全部 -->
										<li>
											<a th:href="@{/shop/left(minPrice=${minPrice}, max=${maxPrice})}"
											   th:classappend="${selectedCategoryId} == null ? 'active' : ''">
											   全部
											</a>
											<span class="quantity" th:text="${allCount}"></span>
										</li>
										<!-- 其他分類（逐筆 categories） -->
										<li th:each="c : ${categories}">
											<a th:href="@{/shop/left(categoryId=${c.categoryId},minPrice=${minPrice},maxPrice=${maxPrice})}"
											   th:text="${c.categoryName}" 
											   th:classappend="${selectedCategoryId} == ${c.categoryId} ? 'active' : ''">
											</a> 
											<span class="quantity" th:text="${c.count}"></span>
										</li>
									</ul>
								</div>
								
								<!-- 價格範圍查詢（GET 提交，保留 categoryId） -->
								<div class="single-sidebar-widget mb-40">
									<h2 class="single-sidebar-widget--title">價格範圍搜尋</h2>
									<form th:action="@{/shop/left}" method="get" class="output-wrapper mt-20">
										<input type="hidden" name="categoryId" th:value="${selectedCategoryId}">
										<div>
											<input type="number" name="minPrice" placeholder="最低價格"
												   th:value="${minPrice}" style="width: 100px;" /> 
											<span>－</span>
											<input type="number" name="maxPrice" placeholder="最高價格"
												   th:value="${maxPrice}" style="width: 100px;" />
										</div>
										<br>
										<button type="submit" class="btn btn-outline-primary btn-sm"
												aria-label="篩選">
											<i class="bi bi-card-list" aria-hidden="true"></i> 
											篩選
										</button>
									</form>
								</div>
							</div>
						</div>

						<!-- 右側：商品清單（支援 Grid / List / QuickView） -->
						<div class="col-lg-9 order-1 order-lg-2 mb-md-80 mb-sm-80">
							<!-- 四欄樣式容器 -->
							<div class="row product-isotope shop-product-wrap four-column">
								<!-- 逐筆商品（hotProducts） -->
								<th:block th:each="p, stat : ${hotProducts}">
									<!-- 防呆：p 為 null 則略過 -->
									<div th:if="${p != null}" class="col-12 col-lg-3 col-md-6 col-sm-6 mb-45 hot sale">

										<!-- Grid 卡片 -->
										<div class="single-product">
											<div class="single-product__image">
												<a class="image-wrap"
												   th:href="@{/shop/product-basic(id=${p.productId})}"> 
													<img th:src="@{/product/DBGifReader(productId=${p.productId})}"
														 class="img-fluid" th:alt="${p.productName}" loading="lazy"
														 decoding="async">
												</a>
												
												<!-- 浮動圖標：收藏 / 分享 / 快速看 -->
												<div class="single-product__floating-icons">
													<!-- 收藏（依 favIds 高亮 / icon 切換） -->
													<span class="wishlist"> 
														<a href="javascript:void(0)" class="btn-wishlist"
														   th:attr="data-product-id=${p.productId}"
														   th:classappend="${favIds != null and favIds.contains(p.productId)} ? ' active' : ''"
														   aria-label="加入收藏" title="加入收藏"> 
															<i th:class="${(favIds != null and favIds.contains(p.productId))} ? 'ion-android-favorite' : 'ion-android-favorite-outline'"></i>
														</a>
													</span> 
													
													<!-- 分享（複製商品連結） -->
													<span class="share"> 
														<a href="javascript:void(0)" class="btn-share" th:attr="data-id=${p.productId}"
														   aria-label="分享連結" title="分享連結"> 
															<i class="ion-ios-shuffle-strong" aria-hidden="true"></i>
														</a>
													</span> 
													
													<!-- 快速瀏覽（開啟 quick-view 面板） -->
													<span class="quickview"> 
														<a class="cd-trigger" th:href="'#qv-' + ${p.productId}" aria-label="快速瀏覽"> 
															<i class="ion-ios-search-strong" aria-hidden="true"></i>
														</a>
													</span>
												</div>
											</div>
											<div class="single-product__content">
												<div class="title">
													<h3>
														<a th:href="@{/shop/product-basic(id=${p.productId})}"
															th:text="${p.productName}">商品名稱</a>
													</h3>
												</div>
												<div class="price">
													<span class="main-price" th:text="'NT$' + ${p.price}">NT$0</span>
												</div>
											</div>
										</div>

										<!-- List 卡片（列表版顯示更多內容/加入購物車） -->
										<div class="single-product--list">
											<div class="single-product__image">
												<a class="image-wrap" th:href="@{/shop/product-basic(id=${p.productId})}"> 
													<img th:src="@{/product/DBGifReader(productId=${p.productId})}"
														 class="img-fluid" th:alt="${p.productName}" loading="lazy"
														 decoding="async">
												</a>
												<div class="single-product__floating-icons">
													<span class="wishlist"> 
														<a href="javascript:void(0)" class="btn-wishlist" 
														   th:attr="data-product-id=${p.productId}"
														   th:classappend="${favIds != null and favIds.contains(p.productId)} ? ' active' : ''"
														   aria-label="加入收藏" title="加入收藏"> 
															<i th:class="${(favIds != null and favIds.contains(p.productId))} ? 'ion-android-favorite' : 'ion-android-favorite-outline'"></i>
														</a>
													</span> 
													<span class="share"> 
														<a href="javascript:void(0)" class="btn-share" th:attr="data-id=${p.productId}"
														   aria-label="分享連結" title="分享連結"> 
															<i class="ion-ios-shuffle-strong" aria-hidden="true"></i>
														</a>
													</span> 
													<span class="quickview"> 
														<a class="cd-trigger" th:href="'#qv-' + ${p.productId}" aria-label="快速瀏覽"> 
															<i class="ion-ios-search-strong" aria-hidden="true"></i>
														</a>
													</span>
												</div>
											</div>
											<div class="single-product__content">
												<div class="title">
													<h3>
														<a th:href="@{/shop/product-basic(id=${p.productId})}"
														   th:text="${p.productName}">
														   商品名稱
														</a>
													</h3>
												</div>
												<div class="price">
													<span class="main-price" th:text="'NT$' + ${p.price}">NT$0</span>
												</div>
												
												<!-- 數量（與加入購物車搭配） -->
												<span class="quickview-title">數量：</span>
												<div class="pro-qty d-inline-block mx-0 pt-0">
													<!-- 用 data-product-id 對應商品 -->
													<input type="number" class="cart-qty" value="1" min="1" th:data-product-id="${p.productId}">
												</div>

												<!-- 加入購物車（走 /api/cart/addToCart） -->
												<div class="add-to-cart-btn mb-25">
													<p class="short-desc" th:text="${p.featureDesc}">特色說明</p>
													<a class="lezada-button lezada-button--medium add-to-cart-btn-s"
													   href="#" th:data-product-id="${p.productId}">
													   加入購物車
													</a>
												</div>
											</div>
										</div>

										<!-- Quick View 面板（同一商品專用，開啟/關閉由下方 JS 控制） -->
										<div th:id="'qv-' + ${p.productId}" class="cd-quick-view">
											<div class="cd-slider-wrapper">
												<ul class="cd-slider">
													<li class="selected">
														<img th:src="@{/product/DBGifReader(productId=${p.productId})}"
															 alt="Product 1">
													</li>
													<li>
														<img th:src="@{/product/DBGifReader(productId=${p.productId})}" alt="Product 2">
													</li>
												</ul>
												<ul class="cd-slider-pagination">
													<li class="active"><a href="#0">1</a></li>
													<li><a href="#1">2</a></li>
												</ul>
												<ul class="cd-slider-navigation">
													<li><a class="cd-prev" href="#0">Prev</a></li>
													<li><a class="cd-next" href="#0">Next</a></li>
												</ul>
											</div>

											<div class="lezada-item-info cd-item-info ps-scroll">
												<h2 class="item-title" th:text="${p.productName}"></h2>
												<p class="price">
													<span class="discounted-price" th:text="'NT$' + ${p.price}"></span>
												</p>
												<p class="description" th:text="${p.featureDesc}"></p>

												<span class="quickview-title">數量：</span>
												<div class="pro-qty d-inline-block mx-0 pt-0">
													<input type="number" class="cart-qty" value="1" min="1"
														th:data-product-id="${p.productId}">
												</div>

												<div class="add-to-cart-btn mb-25">
													<a class="lezada-button lezada-button--medium add-to-cart-btn-s"
													   href="#" th:data-product-id="${p.productId}">
													   加入購物車
													</a>
												</div>

												<a href="#0" class="cd-close">Close</a>
											</div>
										</div>
									</div>
								</th:block>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</section>
	<th:block th:fragment="extraJs">
		<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
		<!-- 如果還有你的頁面圖表初始化 JS，可放這裡 -->

		<script>
		$(document).ready(function() {
		  $(".add-to-cart-btn-s").click(function(e) {
		    e.preventDefault(); // 阻止 <a> 預設跳轉
		
		    const productId = $(this).data("product-id");
		    if (!productId) return; // 避免空值觸發
		
		    // 只在當前商品卡片區塊中找 input
		    const qtyInput = $(this).closest(".lezada-item-info").find(".cart-qty");
		    // const qtyInput = $("input.cart-qty[data-product-id='" + productId + "']");
		    const qty = parseInt(qtyInput.val(), 10) || 1;
		
		    console.log("qtyInput:", qtyInput);
		    console.log("qtyInput.val():", qtyInput.val());
		    console.log("productId:", productId);
		    console.log("qty:", qty);
		
		    $.ajax({
		      url: "/api/cart/addToCart",  // 後端 Controller 會自動判斷會員或訪客
		      type: "POST",
		//       contentType: "application/json",
		      data: {
		          productId: productId,
		          quantity: qty
		        },
		      success: function() {
		    	  $(".cd-quick-view").removeClass("is-visible").hide();
		    	  window.Swal && Swal.fire({
		//     	  Swal.fire({
		              icon: 'success',
		              title: '已加入購物車',
		              background: '#fff',
		              backdrop: 'rgba(0, 0, 0, 0.4)',
		              showConfirmButton: false,
		              timer: 1200
		            });
		        //alert("已加入購物車！");
		        // 刷新購物車 icon 顯示數量
		        refreshCart();
		      },
		      error: function(xhr) {
		        alert("加入購物車失敗：" + xhr.responseText);
		      }
		    });
		  });
		});
		</script>
		<script th:inline="javascript">
		(function(){
		  document.addEventListener('click', async function(e){
		    const a = e.target.closest('a.btn-wishlist');
		    if (!a) return;
		    e.preventDefault();
		
		    const pid = a.getAttribute('data-product-id') || a.dataset.productId;
		    if (!pid) return;
		
		    const toggleUrl = /*[[@{/api/wishlist/toggle}]]*/ '/api/wishlist/toggle';
		    const loginUrl  = /*[[@{/shop/login}]]*/ '/shop/login';
		
		    try {
		      const res = await fetch(toggleUrl, {
		        method:'POST',
		        headers:{'Content-Type':'application/x-www-form-urlencoded'},
		        body: new URLSearchParams({ productId: pid })
		      });
		
		      if (res.status === 401) {
		        // 未登入：彈出提醒，按下「前往登入」再導頁
		        if (window.Swal) {
		          Swal.fire({
		            icon: 'warning',
		            title: '請先登入',
		            text: '登入後即可收藏商品',
		            showCancelButton: true,
		            confirmButtonText: '前往登入',
		            cancelButtonText: '取消'
		          }).then(r => { if (r.isConfirmed) location.href = loginUrl; });
		        } else {
		          location.href = loginUrl;
		        }
		        return;
		      }
		
		      if (!res.ok) {
		        window.Swal ? Swal.fire({icon:'error', title:'操作失敗', text:'伺服器回應 ' + res.status})
		                    : alert('操作失敗 ('+res.status+')');
		        return;
		      }
		
		      const data = await res.json();
		      const icon = a.querySelector('i');
		
		      if (data.favorited) {
		        // 變成已收藏
		        a.classList.add('active');
		        icon?.classList.remove('ion-android-favorite-outline');
		        icon?.classList.add('ion-android-favorite');
		        a.setAttribute('aria-label','已加入收藏');
		        a.setAttribute('title','已加入收藏');
		
		        // 成功提示
		        window.Swal && Swal.fire({
		          icon: 'success',
		          title: '已成功收藏',
		          showConfirmButton: false,
		          timer: 1200
		        });
		      } else {
		        // 取消收藏
		        a.classList.remove('active');
		        icon?.classList.remove('ion-android-favorite');
		        icon?.classList.add('ion-android-favorite-outline');
		        a.setAttribute('aria-label','加入收藏');
		        a.setAttribute('title','加入收藏');
		
		        // 取消提示（可改成 success/neutral 都行）
		        window.Swal && Swal.fire({
		          icon: 'info',
		          title: '已取消收藏',
		          showConfirmButton: false,
		          timer: 1000
		        });
		      }
		   // ★★★ 就放在這裡：通知 overlays.html 重新刷新 mini 收藏清單
		      document.dispatchEvent(new Event('wishlist:changed'));
		 
		    } catch (err) {
		      console.error(err);
		      window.Swal ? Swal.fire({icon:'error', title:'網路或伺服器錯誤'})
		                  : alert('網路或伺服器錯誤');
		    }
		  });
		})();
		</script>
		<script>
		(function(){
		  function openQuick(sel){
		    const panel = document.querySelector(sel);
		    if (!panel) return;
		    panel.style.display = 'block';
		    panel.setAttribute('aria-hidden','false');
		    panel.classList.add('is-visible');
		    document.body.classList.add('no-scroll');
		  }
		  function closeQuick(panel){
		    panel.classList.remove('is-visible');
		    panel.style.display = 'none';
		    panel.setAttribute('aria-hidden','true');
		    document.body.classList.remove('no-scroll');
		  }
		
		  // 打開
		  document.addEventListener('click', function(e){
		    const trigger = e.target.closest('a.cd-trigger');
		    if (!trigger) return;
		    e.preventDefault();
		    const sel = trigger.getAttribute('href'); // 例如 #qv-123
		    if (sel && sel.startsWith('#')) openQuick(sel);
		  });
		
		  // 關閉（按 x）
		  document.addEventListener('click', function(e){
		    const btn = e.target.closest('.cd-close');
		    if (!btn) return;
		    e.preventDefault();
		    const panel = btn.closest('.cd-quick-view');
		    if (panel) closeQuick(panel);
		  });
		
		  // 關閉（ESC）
		  document.addEventListener('keydown', function(e){
		    if (e.key === 'Escape') {
		      document.querySelectorAll('.cd-quick-view.is-visible').forEach(closeQuick);
		    }
		  });
		})();
		
		//事件代理：點任何 .btn-share 都會觸發
		document.addEventListener('click', async function(e){
		  const btn = e.target.closest('a.btn-share');
		  if (!btn) return;
		  e.preventDefault();
		
		  // 取商品 ID，組成單獨頁面的網址
		  const pid = btn.getAttribute('data-id');
		  if (!pid) return;
		
		  // 用目前來源自動組：協議+網域+port -> http://localhost:8080
		  const url = window.location.origin + '/shop/product-basic?id=' + encodeURIComponent(pid);
		
		  // 1) 複製到剪貼簿（需安全環境：HTTPS 或 localhost；不支援時再用老方法）
		  if (navigator.clipboard && window.isSecureContext) {
		    try {
		      await navigator.clipboard.writeText(url);
		      alert('商品連結已複製，可以分享給朋友！\n' + url);
		      return;
		    } catch (err) {
		      // 失敗則 fallback
		    }
		  }
		
		  // 2) 最終 fallback（建立暫時 input 選取複製）
		  const temp = document.createElement('input');
		  temp.value = url;
		  document.body.appendChild(temp);
		  temp.select();
		  try {
		    document.execCommand('copy');
		    alert('商品連結已複製，可以分享給朋友！\n' + url);
		  } finally {
		    document.body.removeChild(temp);
		  }
		});
		</script>
	<style>
	/* 沒有主題腳本也能顯示/隱藏 */
	.cd-quick-view {
		display: none;
	}
	
	.cd-quick-view.is-visible {
		display: block;
	}
	
	body.no-scroll {
		overflow: hidden;
	}
	
	.btn-wishlist.pulse {
		animation: pulse .35s ease;
	}
	
	@keyframes pulse { 0%{transform: scale(1)}50%{transform:scale(1.18)}100%{transform:scale(1)}}
	
	.btn-wishlist.active i {
		filter: drop-shadow(0 0 2px rgba(0, 0, 0, .2));
	}
	</style>

	</th:block>
</body>
</html>
